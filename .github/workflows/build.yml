name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build app
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./build.sh --zip

      - name: Build CLI
        run: swiftc -O -parse-as-library Tools/cli.swift Sources/FitPatcher.swift -o build/fitfix

      - uses: actions/upload-artifact@v7
        with:
          name: Whoosh2Garmin-macOS
          path: build/Whoosh2Garmin.zip
          if-no-files-found: error
          compression-level: 0

  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build portable Windows app
        run: dotnet publish Windows/Whoosh2Garmin.csproj --configuration Release --runtime win-x64 --self-contained true --output build/windows-x64

      - name: Package Windows app
        run: Compress-Archive -LiteralPath build/windows-x64/Whoosh2Garmin.exe -DestinationPath build/Whoosh2Garmin-Windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Whoosh2Garmin-Windows-x64
          path: build/Whoosh2Garmin-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Whoosh2Garmin-*
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/Whoosh2Garmin.zip release-assets/Whoosh2Garmin-Windows-x64.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Whoosh2Garmin $GITHUB_REF_NAME" --generate-notes
