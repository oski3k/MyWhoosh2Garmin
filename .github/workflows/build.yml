name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./build.sh --zip

      - name: Build CLI
        run: swiftc -O -parse-as-library Tools/cli.swift Sources/FitPatcher.swift -o build/fitfix

      - uses: actions/upload-artifact@v4
        with:
          name: Whoosh2Garmin
          path: build/Whoosh2Garmin.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Whoosh2Garmin.zip \
            --title "Whoosh2Garmin $GITHUB_REF_NAME" --generate-notes
