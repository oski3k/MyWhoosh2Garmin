name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where did it go wrong?
      options:
        - The app wouldn't open
        - The app beeped / didn't create a fixed file
        - The fixed file was saved, but the original was still present
        - Garmin Connect rejected the import
        - Imported, but no training load / Exercise Load
        - Other
    validations:
      required: true
  - type: input
    id: garmin
    attributes:
      label: Garmin device model
      placeholder: e.g. Forerunner 965, Edge 840
  - type: input
    id: platform
    attributes:
      label: Operating system and device type
      description: Include the Windows version and system type, or the macOS version and Mac chip.
      placeholder: e.g. Windows 11 x64 or macOS 15.2 on Apple Silicon
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Whoosh2Garmin release or commit
      placeholder: e.g. v1.1.0 or the commit you built from
  - type: textarea
    id: file
    attributes:
      label: FIT file (optional)
      description: >
        A synthetic sample is welcome. FIT files may contain timestamps, location, heart
        rate and power. GitHub attachments are public, so only share files you want to make public.
